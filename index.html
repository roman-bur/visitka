<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ресторан Цветов — контакты</title>
<meta name="description" content="Ресторан Цветов — цветы с доставкой по Уфе и пригородам. Заказ, контакты и адреса магазинов.">
<meta name="theme-color" content="#0c3f2c">
<style>
  /* Шрифты лежат рядом со страницей — без запросов к Google (152-ФЗ) */
  @font-face{font-family:Lora;src:url(fonts/lora.woff) format("woff");font-weight:400 700;font-style:normal;font-display:swap}
  @font-face{font-family:Lora;src:url(fonts/lora-italic.woff) format("woff");font-weight:400 700;font-style:italic;font-display:swap}
  @font-face{font-family:Inter;src:url(fonts/inter-400.woff) format("woff");font-weight:400 500;font-display:swap}
  @font-face{font-family:Inter;src:url(fonts/inter-600.woff) format("woff");font-weight:600 700;font-display:swap}
  :root{
    --bg:#0c3f2c; --bg2:#072a1c; --card:rgba(255,255,255,.05); --cream:#f4ecdc; --muted:#cfc6b2;
    --gold:#d8b46a; --gold-l:#ecd39a; --line:rgba(216,180,106,.35); --dark:#1f2a20;
    --goldbtn:linear-gradient(180deg,#e3c47f 0%,#d6b264 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg2)}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;color:var(--cream);line-height:1.4;min-height:100vh;
    background:radial-gradient(120% 55% at 50% 0%,#135238 0%,var(--bg) 50%,var(--bg2) 100%) fixed}
  a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
  a:active{opacity:.85}
  .wrap{max-width:460px;margin:0 auto;
    padding:calc(6px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}

  header{text-align:center;margin-bottom:10px}
  .logo{display:block;width:52%;max-width:210px;margin:0 auto}
  .tagline{font-size:14px;color:var(--muted);margin-top:2px}

  /* Главное предложение */
  .hero{border-radius:18px;overflow:hidden;border:1px solid var(--gold);background:#0e3526;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .hero img{display:block;width:100%;aspect-ratio:12/5;object-fit:cover;background:#0b2c1f}
  .hero .in{padding:14px 16px 16px;background:#0e3526}
  .pill{display:inline-block;background:var(--gold);color:var(--dark);font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    border-radius:999px;padding:4px 12px;margin-bottom:10px}
  .hero h1{font-family:Lora,Georgia,serif;font-weight:700;font-size:24px;line-height:1.18;color:var(--cream)}
  .hero h1 .l2{display:block;color:var(--gold);font-size:30px;margin-top:2px}
  .hero .date{font-size:16px;margin-top:8px;color:var(--cream)}
  .hero .cond{font-size:14px;color:var(--muted);margin-top:4px}
  .btn-gold{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:14px;padding:12px 16px;border-radius:12px;
    background:var(--goldbtn);color:var(--dark);font-weight:700;font-size:17px;border:0;font-family:inherit;cursor:pointer}
  .btn-gold svg{width:20px;height:20px}
  .btn-line{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;margin-top:8px;padding:10px 16px;border-radius:12px;
    border:1px solid var(--gold);color:var(--cream);font-weight:600;font-size:16px}

  /* Ещё предложения */
  .offers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .offer{display:flex;flex-direction:column;min-height:44px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
  .offer b{font-family:Lora,Georgia,serif;font-size:17px;color:var(--gold-l);line-height:1.2}
  .offer span{font-size:14px;color:var(--muted);margin-top:4px;flex:1}
  .offer i{font-style:normal;font-size:15px;font-weight:600;color:var(--gold);margin-top:8px}

  h2{font-family:Lora,Georgia,serif;font-size:19px;font-weight:600;color:var(--gold);margin:18px 2px 8px}

  /* Контакты */
  .row{display:flex;align-items:center;gap:12px;min-height:56px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
  .row + .row{margin-top:8px}
  .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 34px;color:#fff;font-weight:700;font-size:13px;letter-spacing:.3px}
  .ic svg{width:19px;height:19px}
  .row .t{flex:1;min-width:0;font-weight:600;font-size:16px}
  .row .t small{display:block;font-weight:500;font-size:14px;color:var(--muted)}
  .chips{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
  .chip{display:flex;align-items:center;gap:10px;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:7px 12px;background:var(--card);font-size:15px}
  .chip .ic{width:30px;height:30px;flex-basis:30px;border-radius:8px}
  .chip b{font-weight:600}
  .chip span{color:var(--muted)}

  /* Магазины */
  .shop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
  .shop + .shop{margin-top:8px}
  .shop .t{flex:1 1 170px;min-width:0}
  .shop .t b{display:block;font-size:16px}
  .shop .t small{display:block;font-size:14px;color:var(--muted)}
  .route{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;
    font-size:14px;font-weight:600;color:var(--gold-l);border:1px solid var(--gold);border-radius:999px;padding:8px 14px;white-space:nowrap}
  .route svg{width:15px;height:15px}

  footer{text-align:center;font-size:14px;color:var(--muted);margin-top:18px}

  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#f4ecdc;color:var(--dark);font-size:14px;font-weight:600;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);
    transition:.25s;max-width:calc(100% - 28px);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.webp" alt="Ресторан Цветов">
    <div class="tagline" id="tagline"></div>
  </header>

  <section class="hero" id="hero"></section>
  <div class="offers" id="offers"></div>

  <h2>Связаться</h2>
  <div id="contacts"></div>
  <div class="chips" id="chips"></div>

  <h2>Наши магазины</h2>
  <div id="shops"></div>

  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ====== НАСТРОЙКИ СТРАНИЦЫ — всё, что меняется, здесь ====== */
const MAX_CHAT   = "https://max.ru/u/f9LHodD0cOLPcxpZ28BFtZuxeIFtUzkaDAytHK9HcMKKMsBY7CD9Fsez-CU";
const VK_CATALOG = "https://vk.com/market-222119916?screen=group";

const CONFIG = {
  brand: "Ресторан Цветов",
  tagline: "Цветы с доставкой по Уфе и пригородам",

  // Яндекс Метрика: номер счётчика (цифры). Пусто — учёт выключен.
  metrikaId: "",

  // Главная акция. После даты until (включительно, по Уфе) вместо неё показывается fallback.
  // image — фото букета, например "banners/mama.jpg". Пусто — без фото.
  // conditions — условия скидки. ЗАПОЛНИТЬ до печати визиток: до какого числа предзаказ,
  // на какие букеты скидка, ограничения. Пусто — строка не показывается.
  promo: {
    until: "2026-11-29",
    line1: "Цветы ко Дню матери",
    line2: "−15% по предзаказу",
    tag: "Предзаказ",
    date: "29 ноября · Порадуйте маму цветами.",
    conditions: "",
    image: "banners/mama.jpg",
    button:  { text: "Заказать со скидкой", url: MAX_CHAT,
               message: "Здравствуйте! Хочу заказать букет ко Дню матери со скидкой 15%" },
    button2: { text: "Посмотреть букеты", url: VK_CATALOG }
  },

  // Показывается, когда акция закончилась и новую ещё не вписали
  fallback: {
    line1: "Букеты на любой повод",
    line2: "Соберём и доставим",
    date: "", conditions: "", image: "",
    button:  { text: "Заказать букет", url: MAX_CHAT, message: "Здравствуйте! Хочу заказать букет" },
    button2: { text: "Посмотреть букеты", url: VK_CATALOG }
  },

  // Две дополнительные карточки
  offers: [
    { title: "Подписка на цветы", text: "Регулярная доставка букетов", link: "Подробнее →",
      url: MAX_CHAT, message: "Здравствуйте! Расскажите, пожалуйста, про подписку на цветы" },
    { title: "Букет ко дню рождения", text: "Поможем выбрать и доставим", link: "Подобрать букет →",
      url: MAX_CHAT, message: "Здравствуйте! Помогите подобрать букет ко дню рождения" }
  ],

  phone: "+79270810209",
  maxChat: { name: "Написать в MAX", sub: "Ответим и поможем с выбором", url: MAX_CHAT },

  chips: [
    { name: "Telegram", sub: "написать нам", url: "https://t.me/flora_rest_ufa", color: "#27a6e5", icon: "plane", goal: "telegram" },
    { name: "ВКонтакте", sub: "каталог букетов", url: VK_CATALOG, color: "#0077ff", badge: "VK", goal: "vk" }
  ],

  // Магазины: адрес как в 2ГИС, ссылка на точку в 2ГИС (сверено 11.11.2026)
  shops: [
    { name: "Зубово",          address: "с. Зубово, ул.\u00a0Серебряная,\u00a091",            map: "https://2gis.ru/ufa/geo/70000001026955323" },
    { name: "Михайловка",      address: "с. Михайловка, проезд Мебельщиков,\u00a010/1",  map: "https://2gis.ru/ufa/geo/70000001080571287" },
    { name: "Центр (Ленина)",  address: "Уфа, ул.\u00a0Ленина,\u00a066, 1\u00a0этаж",              map: "https://2gis.ru/ufa/geo/70000001104066420" }
  ]
};
/* ====== конец настроек ====== */

const ICONS = {
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 2 11l7 2.5L11.5 21 22 3z"/><path d="m9 13.5 5-4"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8-8-2z"/></svg>'
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ext = 'target="_blank" rel="noopener"';
const fmtPhone = p => p.replace(/^\+7(\d{3})(\d{3})(\d{2})(\d{2})$/, "+7 $1 $2-$3-$4");
const $ = id => document.getElementById(id);
const msgAttr = m => m ? ` data-msg="${esc(m)}"` : "";

$("tagline").textContent = CONFIG.tagline;
$("foot").textContent = "© " + new Date().getFullYear() + " " + CONFIG.brand;

/* Акция: сегодняшняя дата по Уфе (Asia/Yekaterinburg). Просроченная акция не показывается. */
const todayUfa = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Yekaterinburg"}).format(new Date()); // ГГГГ-ММ-ДД
const p = (CONFIG.promo && (!CONFIG.promo.until || todayUfa <= CONFIG.promo.until)) ? CONFIG.promo : CONFIG.fallback;
$("hero").innerHTML =
  (p.image ? `<img src="${esc(p.image)}" alt="${esc(p.line1)}">` : "") +
  `<div class="in">
     ${p.tag ? `<span class="pill">${esc(p.tag)}</span>` : ""}
     <h1>${esc(p.line1)}<span class="l2">${esc(p.line2)}</span></h1>
     ${p.date ? `<div class="date">${esc(p.date)}</div>` : ""}
     ${p.conditions ? `<div class="cond">${esc(p.conditions)}</div>` : ""}
     <a class="btn-gold" data-goal="order" href="${esc(p.button.url)}" ${ext}${msgAttr(p.button.message)}>${ICONS.chat}${esc(p.button.text)}</a>
     ${p.button2 ? `<a class="btn-line" data-goal="catalog" href="${esc(p.button2.url)}" ${ext}>${esc(p.button2.text)}</a>` : ""}
   </div>`;

$("offers").innerHTML = CONFIG.offers.map(o =>
  `<a class="offer" data-goal="offer" data-label="${esc(o.title)}" href="${esc(o.url)}" ${ext}${msgAttr(o.message)}>
     <b>${esc(o.title)}</b><span>${esc(o.text)}</span><i>${esc(o.link)}</i></a>`).join("");

const mc = CONFIG.maxChat;
$("contacts").innerHTML =
  `<a class="row" data-goal="phone" href="tel:${esc(CONFIG.phone)}"><span class="ic" style="background:#2d6a4f">${ICONS.phone}</span>
     <span class="t">Позвонить<small>${fmtPhone(CONFIG.phone)}</small></span></a>
   <a class="row" data-goal="max" href="${esc(mc.url)}" ${ext}><span class="ic" style="background:#6a4cff">${ICONS.chat}</span>
     <span class="t">${esc(mc.name)}<small>${esc(mc.sub)}</small></span></a>`;

$("chips").innerHTML = CONFIG.chips.map(c =>
  `<a class="chip" data-goal="${esc(c.goal)}" href="${esc(c.url)}" ${ext}>
     <span class="ic" style="background:${c.color}">${c.badge ? esc(c.badge) : ICONS[c.icon]}</span>
     <span><b>${esc(c.name)}</b> — ${esc(c.sub)}</span></a>`).join("");

$("shops").innerHTML = CONFIG.shops.map(s =>
  `<div class="shop"><div class="t"><b>${esc(s.name)}</b><small>${esc(s.address)}</small></div>
     <a class="route" data-goal="route" data-label="${esc(s.name)}" href="${esc(s.map)}" ${ext}>${ICONS.nav}Построить маршрут</a></div>`).join("");

/* MAX не умеет подставлять текст в чат по ссылке, поэтому текст копируется —
   клиенту остаётся вставить его в открывшийся чат. */
let toastTimer;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 3500); }
document.addEventListener("click", e => {
  const a = e.target.closest("[data-msg]");
  if (!a || !navigator.clipboard) return;
  navigator.clipboard.writeText(a.dataset.msg).then(() => toast("Текст скопирован — вставьте его в чат"), () => {});
});

/* ====== Учёт переходов и нажатий (Яндекс Метрика) ======
   QR-код ведёт на адрес с ?utm_source=qr&utm_medium=vizitka — так видно, кто пришёл с бумажной визитки.
   Цели («JavaScript-событие»): order, catalog, offer, phone, max, telegram, vk, route, any_click. */
const MID = Number(CONFIG.metrikaId) || 0;
function goal(name, label){
  if (!MID || typeof window.ym !== "function") return;
  try { ym(MID, "reachGoal", name, label ? {label} : undefined); ym(MID, "reachGoal", "any_click"); } catch(e){}
}
document.addEventListener("click", e => { const a = e.target.closest("[data-goal]"); if (a) goal(a.dataset.goal, a.dataset.label); });
if (MID) {
  (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();
   k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
   (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
  ym(MID, "init", { clickmap:true, trackLinks:true, accurateTrackBounce:true });
}
</script>
</body>
</html>
