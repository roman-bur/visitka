<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ресторан Цветов — контакты</title>
<meta name="description" content="Ресторан Цветов, Уфа: заказ букетов, контакты и адреса магазинов">
<meta name="theme-color" content="#0c3f2c">
<style>
  /* Шрифты лежат рядом со страницей — без запросов к Google (152-ФЗ) */
  @font-face{font-family:Lora;src:url(fonts/lora.woff) format("woff");font-weight:400 700;font-style:normal;font-display:swap}
  @font-face{font-family:Lora;src:url(fonts/lora-italic.woff) format("woff");font-weight:400 700;font-style:italic;font-display:swap}
  @font-face{font-family:Inter;src:url(fonts/inter-400.woff) format("woff");font-weight:400 500;font-display:swap}
  @font-face{font-family:Inter;src:url(fonts/inter-600.woff) format("woff");font-weight:600 700;font-display:swap}
  :root{
    --bg:#0c3f2c; --bg2:#06261a; --card:rgba(255,255,255,.045); --ink:#f3ead6; --muted:#b9b29c;
    --gold:#d4ae5a; --gold2:#f3dc95; --line:rgba(212,174,90,.32); --dark:#1d2a1f;
    --goldgrad:linear-gradient(135deg,#a9802f 0%,#f3dc95 45%,#c99a3e 70%,#f0d48a 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg2)}
  body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);line-height:1.35;min-height:100vh;
    background:radial-gradient(120% 60% at 50% 0%,#145a3f 0%,var(--bg) 45%,var(--bg2) 100%) fixed}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:460px;margin:0 auto;padding:10px 14px 28px}
  .serif{font-family:Lora,Georgia,serif}

  header{text-align:center;margin-bottom:12px}
  .logo{display:block;width:56%;max-width:220px;margin:4px auto 0}
  .hello{font-family:Lora,Georgia,serif;font-style:italic;font-size:15px;color:var(--gold2);margin-top:2px}

  /* Главное предложение */
  .hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    background:radial-gradient(circle at 85% 10%,#7a2f45 0%,#4a1a2b 45%,#2a0f19 100%);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .hero img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .hero .in{padding:16px 16px 16px}
  .tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--gold2);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .hero h1{font-family:Lora,Georgia,serif;font-weight:700;font-size:27px;line-height:1.1;margin-top:10px}
  .hero h1 .acc{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:14px;color:#eadfcb;margin-top:6px}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:13px 16px;border-radius:12px;
    background:var(--goldgrad);color:var(--dark);font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(212,174,90,.25)}
  .cta svg{width:20px;height:20px}
  .cta2{display:flex;align-items:center;justify-content:center;width:100%;margin-top:8px;padding:11px 16px;border-radius:12px;
    border:1px solid var(--gold);color:var(--gold2);font-weight:600;font-size:15px}

  /* Ещё предложения */
  .offers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .offer{display:block;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--card)}
  .offer b{display:block;font-family:Lora,Georgia,serif;font-size:16px;color:var(--gold2);line-height:1.15}
  .offer span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}

  h2{font-family:Lora,Georgia,serif;font-size:18px;font-weight:600;color:var(--gold);margin:20px 2px 8px}

  /* Контакты */
  .row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--card)}
  .row + .row{margin-top:8px}
  .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px;color:#fff}
  .ic svg{width:18px;height:18px}
  .row .t{flex:1;font-weight:600;font-size:15px}
  .row .t small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
  .socials{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 2px}
  .socials .lbl{font-size:13px;color:var(--muted);margin-right:2px}
  .soc{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
  .soc svg{width:20px;height:20px}

  /* Магазины */
  .shop{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
  .shop + .shop{margin-top:8px}
  .shop .t{flex:1;min-width:0}
  .shop .t b{display:block;font-size:15px}
  .shop .t small{display:block;font-size:13px;color:var(--muted)}
  .route{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--gold2);
    border:1px solid var(--gold);border-radius:999px;padding:7px 11px;white-space:nowrap}
  .route svg{width:14px;height:14px}

  footer{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
  a:active{opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="logo.webp" alt="Ресторан Цветов">
    <div class="hello" id="hello"></div>
  </header>

  <section class="hero" id="hero"></section>
  <div class="offers" id="offers"></div>

  <h2>Связаться</h2>
  <div id="contacts"></div>
  <div class="socials" id="socials"></div>

  <h2>Наши магазины</h2>
  <div id="shops"></div>

  <footer id="foot"></footer>
</div>

<script>
/* ====== НАСТРОЙКИ СТРАНИЦЫ — всё, что меняется, здесь ====== */
const MAX_CHAT = "https://max.ru/u/f9LHodD0cOLPcxpZ28BFtZuxeIFtUzkaDAytHK9HcMKKMsBY7CD9Fsez-CU";
const VK_CATALOG = "https://vk.com/market-222119916?screen=group";

const CONFIG = {
  brand: "Ресторан Цветов",

  // Яндекс Метрика: номер счётчика (цифры). Пусто — учёт выключен.
  metrikaId: "",
  hello: "Рады, что вы с нами",

  // Главное предложение. image — картинка (необязательно, например "banners/mama.jpg").
  main: {
    tag: "Предзаказ",
    title: "Ко Дню матери —",
    accent: "скидка 15%",
    text: "29 ноября. Закажите заранее — соберём к нужному часу.",
    image: "",
    button: { text: "Написать для заказа", url: MAX_CHAT },
    button2: { text: "Выбрать букет", url: VK_CATALOG }
  },

  // Ещё два предложения — компактные карточки
  offers: [
    { title: "Подписка на цветы",     text: "Свежий букет каждую неделю", url: MAX_CHAT },
    { title: "Букет ко дню рождения", text: "Поможем выбрать и доставим",  url: MAX_CHAT }
  ],

  // Контакты
  phone: "+79270810209",
  contacts: [
    { name: "Написать в MAX", sub: "Ответим и поможем с выбором", url: MAX_CHAT, color: "#6a4cff", icon: "chat" }
  ],

  // Значки соцсетей
  socials: [
    { name: "Telegram-канал",    url: "https://t.me/cvetyzubovo", color: "#27a6e5", icon: "plane" },
    { name: "Каталог ВКонтакте", url: VK_CATALOG,                 color: "#0077ff", icon: "vk" }
  ],

  // Магазины: ссылка на карточку в 2ГИС
  shops: [
    { name: "Зубово",     address: "ул. Серебряная, 91",       map: "https://2gis.ru/ufa/geo/70000001026955323" },
    { name: "Михайловка", address: "Проезд Мебельщиков, 10/1", map: "https://2gis.ru/ufa/geo/70000001080571287" },
    { name: "Центр",      address: "ул. Ленина, 66",           map: "https://2gis.ru/ufa/geo/70000001104066420" }
  ]
};
/* ====== конец настроек ====== */

const ICONS = {
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 2 11l7 2.5L11.5 21 22 3z"/><path d="m9 13.5 5-4"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  vk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8-8-2z"/></svg>'
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ext = 'target="_blank" rel="noopener"';
const fmtPhone = p => p.replace(/^\+7(\d{3})(\d{3})(\d{2})(\d{2})$/, "+7 $1 $2-$3-$4");
const $ = id => document.getElementById(id);

$("hello").textContent = CONFIG.hello;
$("foot").textContent = "© " + new Date().getFullYear() + " " + CONFIG.brand;

const m = CONFIG.main;
$("hero").innerHTML =
  (m.image ? `<img src="${esc(m.image)}" alt="${esc(m.title + " " + m.accent)}">` : "") +
  `<div class="in">
     ${m.tag ? `<span class="tag">${esc(m.tag)}</span>` : ""}
     <h1>${esc(m.title)} <span class="acc">${esc(m.accent)}</span></h1>
     ${m.text ? `<p>${esc(m.text)}</p>` : ""}
     <a class="cta" data-goal="order" href="${esc(m.button.url)}" ${ext}>${ICONS.chat}${esc(m.button.text)}</a>
     ${m.button2 ? `<a class="cta2" data-goal="catalog" href="${esc(m.button2.url)}" ${ext}>${esc(m.button2.text)}</a>` : ""}
   </div>`;

$("offers").innerHTML = CONFIG.offers.map(o =>
  `<a class="offer" data-goal="offer" data-label="${esc(o.title)}" href="${esc(o.url)}" ${ext}><b>${esc(o.title)}</b><span>${esc(o.text)}</span></a>`).join("");

$("contacts").innerHTML =
  `<a class="row" data-goal="phone" href="tel:${esc(CONFIG.phone)}"><span class="ic" style="background:#2d6a4f">${ICONS.phone}</span>
     <span class="t">Позвонить<small>${fmtPhone(CONFIG.phone)}</small></span></a>` +
  CONFIG.contacts.map(c => `<a class="row" data-goal="max" href="${esc(c.url)}" ${ext}><span class="ic" style="background:${c.color}">${ICONS[c.icon]}</span>
     <span class="t">${esc(c.name)}<small>${esc(c.sub)}</small></span></a>`).join("");

$("socials").innerHTML = `<span class="lbl">Мы в соцсетях:</span>` + CONFIG.socials.map(s =>
  `<a class="soc" data-goal="social" data-label="${esc(s.name)}" href="${esc(s.url)}" ${ext} style="background:${s.color}" aria-label="${esc(s.name)}" title="${esc(s.name)}">${ICONS[s.icon]}</a>`).join("");

$("shops").innerHTML = CONFIG.shops.map(s =>
  `<div class="shop"><div class="t"><b>${esc(s.name)}</b><small>${esc(s.address)}</small></div>
     <a class="route" data-goal="route" data-label="${esc(s.name)}" href="${esc(s.map)}" ${ext}>${ICONS.pin}Построить маршрут</a></div>`).join("");

/* ====== Учёт переходов и нажатий (Яндекс Метрика) ======
   Источник: QR-код на бумажной визитке ведёт на адрес с ?utm_source=qr&utm_medium=vizitka.
   Цели (создать в Метрике как «JavaScript-событие» с этими идентификаторами):
   order — «Написать для заказа», catalog — «Выбрать букет», offer — карточки предложений,
   phone — «Позвонить», max — «Написать в MAX», social — значки соцсетей, route — «Построить маршрут»,
   any_click — любое из нажатий выше. */
const MID = Number(CONFIG.metrikaId) || 0;
function goal(name, label){
  if (!MID || typeof window.ym !== "function") return;
  try { ym(MID, "reachGoal", name, label ? {label} : undefined); ym(MID, "reachGoal", "any_click"); } catch(e){}
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-goal]");
  if (a) goal(a.dataset.goal, a.dataset.label);
});
if (MID) {
  (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();
   k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
   (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
  ym(MID, "init", { clickmap:true, trackLinks:true, accurateTrackBounce:true });
}
</script>
</body>
</html>
